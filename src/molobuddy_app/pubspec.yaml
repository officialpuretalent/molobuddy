name: molobuddy_app
description: Molo makes serious work feel light.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  cupertino_icons: 1.0.9
  dio: 5.11.0
  firebase_app_check: 0.4.6
  firebase_auth: 6.5.7
  firebase_core: 4.13.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Riverpod 3.3.2 is the newest family resolvable on Flutter 3.44.0.
  flutter_riverpod: 3.3.2
  go_router: 17.5.0
  # Flutter 3.44.0 pins flutter_localizations to intl 0.20.2.
  intl: 0.20.2
  # Matched to the newest generator compatible with Flutter 3.44.0.
  riverpod_annotation: 4.0.3

dev_dependencies:
  # Flutter 3.44.0 pins meta 1.18.0; build_runner 2.15.2+ needs 1.18.3.
  build_runner: 2.15.1
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  go_router_builder: 4.4.0
  # Riverpod generator 4.0.6+ requires analyzer 13 and a newer Flutter SDK.
  riverpod_generator: 4.0.4
  # Riverpod lint 3.1.4 matches analyzer 12 and generator 4.0.4.
  riverpod_lint: 3.1.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    # Listed file by file rather than by directory: assets/brand/ also holds
    # two unreferenced megabyte PNGs, and registering the directory would
    # bundle them into every build.
    - assets/brand/signin-portrait.webp
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
