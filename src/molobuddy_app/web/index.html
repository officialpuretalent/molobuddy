<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Molo makes serious work feel light.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Molo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Molo</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: light;
      background: #fff9f7;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #fff9f7;
    }

    body {
      overflow: hidden;
    }

    #molo-bootstrap {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #fff9f7;
      opacity: 1;
      transition: opacity 180ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    #molo-bootstrap.is-leaving {
      pointer-events: none;
      opacity: 0;
    }

    .molo-bootstrap__lockup {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #241529;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 34px;
      font-weight: 500;
      letter-spacing: -1.8px;
    }

    .molo-bootstrap__pulse {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #f25775;
      animation: molo-pulse 1.1s cubic-bezier(0.22, 1, 0.36, 1) infinite alternate;
    }

    @keyframes molo-pulse {
      from {
        opacity: 0.42;
        transform: scale(0.82);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #molo-bootstrap {
        transition: none;
      }

      .molo-bootstrap__pulse {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="molo-bootstrap" role="status" aria-label="Opening Molo">
    <div class="molo-bootstrap__lockup" aria-hidden="true">
      <span>molo</span>
      <span class="molo-bootstrap__pulse"></span>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
